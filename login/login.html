<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiók - Midnight Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>

<body>

  <!-- Globális háttér rétegek -->
  <div class="bg-layer bg-grid" aria-hidden="true"></div>
  <div class="bg-layer bg-glow bg-glow-gold" aria-hidden="true"></div>
  <div class="bg-layer bg-glow bg-glow-wine" aria-hidden="true"></div>
  <div class="bg-layer bg-grain" aria-hidden="true"></div>
  <div class="bg-layer bg-filmstrip-1" aria-hidden="true"></div>
  <div class="bg-layer bg-filmstrip-2" aria-hidden="true"></div>

  <!-- Vissza gomb -->
  <a href="midnight.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
    Vissza a főoldalra
  </a>

  <!-- TARTALOM -->
  <main class="auth-wrapper">
    <div class="auth-container">

      <!-- Logó -->
      <div class="auth-header">
        <a href="midnight.html" class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2" />
            <path d="M6 6v12M18 6v12M2 10h4M2 14h4M18 10h4M18 14h4" />
          </svg>
          <span class="logo-text">Midnight<span>Cinema</span></span>
        </a>
      </div>

      <!-- Rejtett rádiógombok a fülek váltásához -->
      <input type="radio" name="auth-tab" id="tab-login" class="auth-radio" checked>
      <input type="radio" name="auth-tab" id="tab-register" class="auth-radio">

      <!-- Fülek -->
      <div class="auth-tabs">
        <label for="tab-login" class="auth-tab">Bejelentkezés</label>
        <label for="tab-register" class="auth-tab">Regisztráció</label>
        <div class="tab-slider"></div>
      </div>

      <!-- Űrlapok -->
      <div class="auth-forms">

        <!-- BEJELENTKEZÉS -->
        <form class="auth-form form-login" action="#" method="POST">
          <div class="input-group">
            <label for="login-email">Email cím</label>
            <input type="email" id="login-email" name="login_email" placeholder="pelda@email.com" required>
          </div>

          <div class="input-group">
            <label for="login-password">Jelszó</label>
            <div class="password-wrapper">
              <input type="password" id="login-password" name="login_password" placeholder="••••••••" required>
              <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox">
              <span>Emlékezz rám</span>
            </label>
            <a href="#" class="forgot-pw">Elfelejtett jelszó?</a>
          </div>

          <button type="submit" class="btn-gold btn-full">
            Bejelentkezés
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>

        <!-- REGISZTRÁCIÓ (Itt van az ID a JS-hez) -->
        <form class="auth-form form-register" id="registerForm">
          <div class="input-group">
            <label for="reg-name">Teljes név</label>
            <input type="text" id="reg-name" name="nev" placeholder="Kiss Péter" required>
          </div>
          <div class="input-group">
            <label for="reg-email">Email cím</label>
            <input type="email" id="reg-email" name="emailcim" placeholder="pelda@email.com" required>
          </div>
          <div class="input-group">
            <label for="reg-tel">Telefon szám</label>
            <input type="tel" id="reg-tel" name="telszam" placeholder="06201234567" pattern="[0-9+\-\s()]+" required>
          </div>
          <div class="input-group">
            <label for="reg-birth">Születési dátum</label>
            <input type="date" id="reg-birth" name="szuletesi_datum" min="1900-01-01" required>
          </div>
          <div class="input-group">
            <label for="reg-password">Jelszó</label>
            <div class="password-wrapper">
              <input type="password" id="reg-password" name="jelszo" placeholder="••••••••" required>
              <button type="button" class="toggle-password" onclick="togglePassword('reg-password', this)">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <div class="terms-checkbox">
              <label class="checkbox-wrapper">
                <input type="checkbox" required>
                <span class="checkmark"></span>
              </label>
              <span class="terms-text">
                Elolvastam és elfogadom az <a href="aszf.html">Általános Szerződési Feltételeket</a>, valamint az <a
                  href="privacy.html">Adatvédelmi Tájékoztatót</a>.
              </span>
            </div>
          </div>

          <button type="submit" class="btn-gold btn-full">
            Fiók létrehozása
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>

      </div>
    </div>
  </main>

  <!-- JAVASCRIPT RÉSZ -->
  <script>
    // 1. Évszám limitálása 4 karakterre
    document.getElementById('reg-birth').addEventListener('input', function (e) {
      const parts = e.target.value.split('-');
      if (parts[0] && parts[0].length > 4) {
        parts[0] = parts[0].slice(0, 4);
        e.target.value = parts.join('-');
      }
    });

    // 2. Jelszó megjelenítése / elrejtése
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const eyeIcon = btn.querySelector('svg');

      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.style.opacity = '0.5';
      } else {
        input.type = 'password';
        eyeIcon.style.opacity = '1';
      }
    }

    // 3. Regisztráció beküldése (Fetch API)
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault(); // Megakadályozzuk az oldal újratöltését

      // Adatok összegyűjtése a HTML mezőkből (a helyes ID-kkal!)
      const nev = document.getElementById('reg-name').value;
      const emailcim = document.getElementById('reg-email').value;
      const telszam = document.getElementById('reg-tel').value;
      const szuletesi_datum = document.getElementById('reg-birth').value;
      const jelszo = document.getElementById('reg-password').value;

      try {
        // Adatok küldése a szervernek
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            nev,
            emailcim,
            telszam,
            szuletesi_datum,
            jelszo
          })
        });

        const result = await response.json();

        if (result.success) {
          alert('Sikeres regisztráció! Most már bejelentkezhetsz.');
          // Visszaváltunk a bejelentkezés fülre
          document.getElementById('tab-login').checked = true;
          document.getElementById('registerForm').reset();
        } else {

        }
      } catch (err) {
        console.error(err);

      }
    });
        // 4. Bejelentkezés kezelése
    document.querySelector('.form-login').addEventListener('submit', async function(e) {
      e.preventDefault();

      const emailcim = document.getElementById('login-email').value;
      const jelszo = document.getElementById('login-password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailcim, jelszo })
        });

        const result = await response.json();

        if (result.success) {
          // SIKERES BEJELENTKEZÉS
          // Elmentjük a felhasználót a böngészőbe (localStorage)
          localStorage.setItem('bejelentkezettUser', JSON.stringify(result.user));
          
          // Átirányítjuk a főoldalra
          window.location.href = 'midnight.html';
        } else {
          // Hibaüzenet (pl. rossz jelszó)
          alert(result.error); // Vagy használhatod a korábbi form-message div-et
        }
      } catch (err) {
        console.error(err);
        alert('Hálózati hiba!');
      }
    });
  </script>
</body>

</html>
