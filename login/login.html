<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiók - Midnight Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Globális háttér rétegek (ugyanazok, mint a főoldalon) -->
  <div class="bg-layer bg-grid" aria-hidden="true"></div>
  <div class="bg-layer bg-glow bg-glow-gold" aria-hidden="true"></div>
  <div class="bg-layer bg-glow bg-glow-wine" aria-hidden="true"></div>
  <div class="bg-layer bg-grain" aria-hidden="true"></div>

  <!-- Vissza gomb a főoldalra -->
  <a href="midnight.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Vissza a főoldalra
  </a>

  <!-- KÖZÉPRE IGAZÍTOTT TARTALOM -->
  <main class="auth-wrapper">
    
    <div class="auth-container">
      
      <!-- Logó -->
      <div class="auth-header">
        <a href="midnight.html" class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2"/>
            <path d="M6 6v12M18 6v12M2 10h4M2 14h4M18 10h4M18 14h4"/>
          </svg>
          <span class="logo-text">Midnight<span>Cinema</span></span>
        </a>
      </div>

      <!-- A CSS-es váltáshoz szükséges rádiógombok (rejtettek) -->
        <input type="radio" name="auth-tab" id="tab-login" class="auth-radio" checked>
        <input type="radio" name="auth-tab" id="tab-register" class="auth-radio">

      <!-- Fülek (Tabok) -->
      <div class="auth-tabs">
        <label for="tab-login" class="auth-tab">Bejelentkezés</label>
        <label for="tab-register" class="auth-tab">Regisztráció</label>
        <div class="tab-slider"></div>
      </div>

      <!-- Űrlapok konténere -->
      <div class="auth-forms">
        
        <!-- BEJELENTKEZÉS ŰRLAP -->
        <form class="auth-form form-login" action="#" method="POST">
          <div class="input-group">
            <label for="login-email">Email cím</label>
            <input type="email" id="login-email" placeholder="pelda@email.com" required>
          </div>
          <div class="input-group">
            <label for="login-password">Jelszó</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>
          
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox">
              <span>Emlékezz rám</span>
            </label>
            <a href="#" class="forgot-pw">Elfelejtett jelszó?</a>
          </div>

          <button type="submit" class="btn-gold btn-full">
            Bejelentkezés
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>

        <!-- REGISZTRÁCIÓ ŰRLAP -->
        <form class="auth-form form-register" action="#" method="POST">
          <div class="input-group">
            <label for="reg-name">Teljes név</label>
            <input type="text" id="reg-name" placeholder="Kiss Péter" required>
          </div>
          <div class="input-group">
            <label for="reg-email">Email cím</label>
            <input type="email" id="reg-email" placeholder="pelda@email.com" required>
          </div>
            <div class="input-group">
            <label for="reg-name">Telefon szám</label>
            <input type="tel" id="reg-name" placeholder="06201234567" pattern="[0-9+\-\s()]+" required>
          </div>
          <div class="input-group">
            <label for="reg-password">Jelszó</label>
            <input type="password" id="reg-password" placeholder="••••••••" required>
          </div>
          
          <div class="form-options">
              <div class="terms-checkbox">
                  <label class="checkbox-wrapper">
                      <input type="checkbox" required>
                      <span class="checkmark"></span>
                  </label>
                  <span class="terms-text">
                      Elolvastam és elfogadom az <a href="aszf.html" target="_blank">Általános Szerződési Feltételeket</a>, valamint az <a href="privacy.html" target="_blank">Adatvédelmi Tájékoztatót</a>.
                  </span>
              </div>
          </div>

          <button type="submit" class="btn-gold btn-full">
            Fiók létrehozása
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>

      </div>
    </div>

  </main>

</body>
</html>
